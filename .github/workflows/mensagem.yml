name: mensagem manual

# Posta uma mensagem escrita por voce, com o nome do bot.
# Seguranca:
# - so quem tem permissao de escrita no repositorio consegue clicar em "Run workflow"
#   (num repositorio publico, visitantes e forks nao conseguem);
# - e, mesmo assim, o job so roda se quem disparou for o dono do repositorio.
on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal"
        type: choice
        default: patch
        options: [patch, eventos, loja, logs]
      titulo:
        description: "Título (opcional)"
        type: string
        required: false
      texto:
        description: "Texto (use \\n para pular linha; aceita **negrito** e links)"
        type: string
        required: true
      imagem:
        description: "URL de uma imagem (opcional)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  enviar:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enviar
        env:
          DISCORD_WEBHOOK_PATCH: ${{ secrets.DISCORD_WEBHOOK_PATCH }}
          DISCORD_WEBHOOK_EVENTOS: ${{ secrets.DISCORD_WEBHOOK_EVENTOS }}
          DISCORD_WEBHOOK_LOJA: ${{ secrets.DISCORD_WEBHOOK_LOJA }}
          DISCORD_WEBHOOK_LOGS: ${{ secrets.DISCORD_WEBHOOK_LOGS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # o texto vai por variavel de ambiente, nunca colado no comando (evita injecao no shell)
          MSG_CANAL: ${{ inputs.canal }}
          MSG_TITULO: ${{ inputs.titulo }}
          MSG_TEXTO: ${{ inputs.texto }}
          MSG_IMAGEM: ${{ inputs.imagem }}
        run: python -m bdo_bot mensagem
