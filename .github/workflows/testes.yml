name: testes

on:
  push:
    branches: [main]
    paths-ignore: ["data/estado.json"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: glossário é JSON válido
        run: python -c "from pathlib import Path; from bdo_bot.glossario import Glossario; g = Glossario.carregar(Path('data/glossario.json')); print(len(g.termos), 'termos')"
